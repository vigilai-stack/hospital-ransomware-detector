[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-ransomware-detector"
version = "0.1.0"
description = "Local lab tool that flags ransomware-like activity on a simulated hospital file share."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sangeeta Sinha"}]
keywords = ["healthcare", "ransomware", "detection", "yara", "lab"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "watchdog>=4.0,<8",
    "yara-python>=4.5,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vigil-detect = "vigil_detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
